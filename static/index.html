<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Webcam transcript</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* page-specific; every value is pre-coach's (studio/static/app.css) */
    .framing-wrap > .col { width: min(560px, 100%); }          /* the framing card's width */
    .framing .headline { margin-top: 24px; }                     /* cam-to-text gap of .framing .eyebrow */
    #transcript { white-space: pre-wrap; overflow-wrap: anywhere; } /* as .msg / .msg.me */
  </style>
</head>
<body>
  <div class="haze" aria-hidden="true"></div>
  <main class="framing-wrap">
    <div class="col">
      <section class="framing">
        <div class="cam"><video id="preview" autoplay muted playsinline></video><div class="thirds" aria-hidden="true"></div></div>
        <h1 class="headline">Webcam transcript</h1>
        <p class="note" id="status">Requesting camera…</p>
      </section>
      <article class="card">
        <p class="eyebrow"><b>Transcript</b></p>
        <div class="tip-text" id="transcript"></div>
      </article>
    </div>
  </main>
  <nav class="dock"><button class="go" id="toggle" disabled><span class="dot" id="toggle-icon"></span><span id="toggle-label">Start recording</span></button></nav>
  <script>
    const preview = document.getElementById("preview");
    const toggle = document.getElementById("toggle");
    const toggleIcon = document.getElementById("toggle-icon");
    const toggleLabel = document.getElementById("toggle-label");
    const statusEl = document.getElementById("status");
    const output = document.getElementById("transcript");
    let stream, recorder, chunks;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
      .then((s) => {
        stream = s;
        preview.srcObject = s;
        toggle.disabled = false;
        statusEl.textContent = "Camera ready.";
      })
      .catch((err) => { statusEl.textContent = `Camera unavailable: ${err.message}`; });

    toggle.onclick = () => {
      if (recorder?.state === "recording") {
        recorder.stop();
        return;
      }
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = transcribe;
      recorder.start();
      toggleLabel.textContent = "Stop recording";
      toggleIcon.className = "sq";
      statusEl.textContent = "Recording…";
      output.textContent = "";
    };

    async function transcribe() {
      toggleLabel.textContent = "Start recording";
      toggleIcon.className = "dot";
      toggle.disabled = true;
      statusEl.textContent = "Transcribing…";
      try {
        const res = await fetch("/transcribe", { method: "POST", body: new Blob(chunks, { type: recorder.mimeType }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        output.textContent = data.transcript;
        statusEl.textContent = "Done.";
      } catch (err) {
        statusEl.textContent = `Transcription failed: ${err.message}`;
      } finally {
        toggle.disabled = false;
      }
    }
  </script>
</body>
</html>
